name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --armor

      - name: Generate APT metadata
        run: |
          SUITES="noble resolute"
          for suite in $SUITES; do
            mkdir -p "dists/$suite/main/binary-amd64" "dists/$suite/main/binary-arm64"
            for arch in amd64 arm64; do
              apt-ftparchive packages pool > "dists/$suite/main/binary-$arch/Packages"
              gzip -9 -c "dists/$suite/main/binary-$arch/Packages" > "dists/$suite/main/binary-$arch/Packages.gz"
            done
            apt-ftparchive release \
              -o APT::FTPArchive::Release::Origin="MungerWare" \
              -o APT::FTPArchive::Release::Label="MungerWare" \
              -o APT::FTPArchive::Release::Suite="$suite" \
              -o APT::FTPArchive::Release::Codename="$suite" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main" \
              -o APT::FTPArchive::Release::Description="MungerWare APT repository" \
              "dists/$suite" > "dists/$suite/Release"

            # by-hash: generated AFTER Release, so apt-ftparchive's directory
            # scan (already done above) never sees/catalogs them as separate
            # entries. Each index file gets a permanent copy at its own
            # hash-named path, alongside the fixed path - lets clients avoid
            # ever fetching stale content through an intermediate cache/CDN,
            # since a changed file is a new URL rather than new content at an
            # old one.
            for arch in amd64 arm64; do
              for f in Packages Packages.gz; do
                src="dists/$suite/main/binary-$arch/$f"
                hash=$(sha256sum "$src" | cut -d' ' -f1)
                mkdir -p "dists/$suite/main/binary-$arch/by-hash/SHA256"
                cp "$src" "dists/$suite/main/binary-$arch/by-hash/SHA256/$hash"
              done
            done
            sed -i '/^MD5Sum:/i Acquire-By-Hash: yes' "dists/$suite/Release"

            gpg --yes --armor --detach-sign --output "dists/$suite/Release.gpg" "dists/$suite/Release"
            gpg --yes --clear-sign --output "dists/$suite/InRelease" "dists/$suite/Release"
          done

      - name: Generate directory indexes
        run: python3 scripts/generate-dir-indexes.py

      - name: Prepare deploy
        run: rm -f .gitignore

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: false
