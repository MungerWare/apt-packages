name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [publish-package]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Handle repository_dispatch (pull published package)
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG_NAME="${{ github.event.client_payload.package }}"
          SRC_REPO="${{ github.event.client_payload.repo }}"
          TAG="${{ github.event.client_payload.tag }}"
          echo "Pulling ${PKG_NAME} from ${SRC_REPO} tag ${TAG}"
          mkdir -p /tmp/dispatch
          gh release download "$TAG" --repo "$SRC_REPO" --dir /tmp/dispatch
          for deb in /tmp/dispatch/*.deb; do
            mkdir -p "pool/main/$PKG_NAME"
            cp "$deb" "pool/main/$PKG_NAME/"
            echo "Staged: $(basename $deb)"
          done

      - name: Install apt-ftparchive
        run: sudo apt-get update && sudo apt-get install -y apt-utils

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --import --batch --armor

      - name: Build packages from src/
        run: |
          for pkgdir in src/*/; do
            [ -d "$pkgdir/DEBIAN" ] || continue
            pkgname=$(basename "$pkgdir")
            version=$(grep "^Version:" "${pkgdir}DEBIAN/control" | head -1 | awk '{print $2}')
            arch=$(grep "^Architecture:" "${pkgdir}DEBIAN/control" | head -1 | awk '{print $2}')
            prefix="${pkgname:0:1}"
            mkdir -p "pool/mungerware/$prefix/$pkgname"
            dpkg-deb --build "$pkgdir" "pool/mungerware/$prefix/$pkgname/${pkgname}_${version}_${arch}.deb"
          done

      - name: Generate APT metadata
        run: |
          SUITES="noble resolute"
          COMPONENTS="main mungerware"
          for suite in $SUITES; do
            for component in $COMPONENTS; do
              mkdir -p "dists/$suite/$component/binary-amd64" "dists/$suite/$component/binary-arm64"
              for arch in amd64 arm64; do
                if [ "$component" = "main" ]; then
                  pool_dirs="vendored main"
                else
                  pool_dirs="mungerware"
                fi
                (cd pool && apt-ftparchive packages $pool_dirs) \
                  > "../dists/$suite/$component/binary-$arch/Packages"
                gzip -9 -c "dists/$suite/$component/binary-$arch/Packages" \
                  > "dists/$suite/$component/binary-$arch/Packages.gz"
              done
            done

            apt-ftparchive release \
              -o APT::FTPArchive::Release::Origin="MungerWare" \
              -o APT::FTPArchive::Release::Label="MungerWare" \
              -o APT::FTPArchive::Release::Suite="$suite" \
              -o APT::FTPArchive::Release::Codename="$suite" \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components="main mungerware" \
              -o APT::FTPArchive::Release::Description="MungerWare APT repository" \
              "dists/$suite" > "dists/$suite/Release"

            # by-hash for each component
            for component in $COMPONENTS; do
              for arch in amd64 arm64; do
                for f in Packages Packages.gz; do
                  src="dists/$suite/$component/binary-$arch/$f"
                  hash=$(sha256sum "$src" | cut -d' ' -f1)
                  mkdir -p "dists/$suite/$component/binary-$arch/by-hash/SHA256"
                  cp "$src" "dists/$suite/$component/binary-$arch/by-hash/SHA256/$hash"
                done
              done
            done

            sed -i '/^MD5Sum:/i Acquire-By-Hash: yes' "dists/$suite/Release"

            gpg --yes --armor --detach-sign --output "dists/$suite/Release.gpg" "dists/$suite/Release"
            gpg --yes --clear-sign --output "dists/$suite/InRelease" "dists/$suite/Release"
          done

      - name: Generate directory indexes
        run: python3 scripts/generate-dir-indexes.py

      - name: Prepare deploy
        run: rm -f .gitignore

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
